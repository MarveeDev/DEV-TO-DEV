name: DEV-TO-DEV CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.13.1

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter api exec prisma generate

      # Lint is intentionally non-blocking. The API and web apps currently carry
      # a large body of pre-existing type-aware ESLint (`no-unsafe-*`) and
      # Prettier findings that predate this pipeline. It runs here so the results
      # are visible on every run, while TypeScript build (type-check) and unit
      # tests remain the hard gates. `eslint --fix` is intentionally not run in
      # CI so files are never rewritten unexpectedly.
      - name: Lint (legacy debt — non-blocking)
        continue-on-error: true
        run: pnpm lint

      - name: Type Check & Build
        run: pnpm build

      - name: Test
        run: pnpm test
